name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 8 */2 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Write to Supabase to keep it active
        run: |
          curl -s -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keepalive_ping" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'
